{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Spotify Clone</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'mainapp/css/style.css' %}" />
    <link rel="icon" href="{% static 'mainapp/assets/favicon.png' %}" />
    <script src="{% static 'mainapp/js/dropdown.js' %}" defer></script>
  </head>
  <body>
    {% block content %} {% include 'mainapp/home.html' %} {% endblock %}

    <script src="{% static 'mainapp/js/script.js' %}"></script>
    <audio id="main-audio-player"></audio>
    <script src="{% static 'mainapp/js/player.js' %}"></script>
  </body>
</html>
